# Builds and tests NEXUS on a clean Windows runner and uploads a self-contained win-x64 build.
name: build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build Nexus.sln -c Release
      - run: dotnet test tests/Nexus.Core.Tests -c Release --no-build
      - run: dotnet publish src/Nexus.App/Nexus.App.csproj -c Release -r win-x64 --self-contained true -o publish/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-win-x64
          path: publish/win-x64
